<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover, user-scalable=no" />
    <title>OurGpsCam</title>
    <meta name="description" content="OurGpsCam - Geotagged photos with live GPS coordinates, map preview, and timestamp watermark." />
    
    <!-- PWA & Mobile Web Capabilities -->
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OurGpsCam" />
    <meta name="application-name" content="OurGpsCam" />
    <meta name="msapplication-TileColor" content="#000000" />
    
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="shortcut icon" href="/favicon.png" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #000000;
        color: #ffffff;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <!-- PWA Service Worker & Install Prompt Hook -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker
            .register('/sw.js', { scope: '/' })
            .then(function(reg) {
              console.log('[OurGpsCam PWA] Service worker registered:', reg.scope);
              reg.onupdatefound = function() {
                var installing = reg.installing;
                installing.onstatechange = function() {
                  if (installing.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('[OurGpsCam PWA] New update available; refresh to apply.');
                  }
                };
              };
            })
            .catch(function(err) {
              console.warn('[OurGpsCam PWA] SW registration failed:', err);
            });
        });
      }

      window.deferredInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.deferredInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('ourgpscam-can-install'));
      });
      window.addEventListener('appinstalled', function() {
        window.deferredInstallPrompt = null;
        console.log('[OurGpsCam PWA] Installed successfully');
        window.dispatchEvent(new CustomEvent('ourgpscam-installed'));
      });
    </script>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run OurGpsCam.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
